<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fotofolio Martha Aisyah Putri</title>
  <meta name="description" content="Fotofolio dan riwayat pendidikan Martha Aisyah Putri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="atas">
    <header class="hero">
      <span class="deco d1" aria-hidden="true">♡</span>
      <span class="deco d2" aria-hidden="true">✦</span>
      <span class="deco d3" aria-hidden="true">♡</span>
      <span class="deco d4" aria-hidden="true">✦</span>

      <figure class="photo">
        <div class="circle" id="circle"><img id="heroFoto" alt="Foto profil"></div>
        <span class="emo e1" aria-hidden="true">🎀</span>
        <span class="emo e2" aria-hidden="true">✨</span>
        <span class="emo e3" aria-hidden="true">🌷</span>
      </figure>

      <p class="hi">Halo, aku</p>
      <h1><span class="hl" id="nama">Martha Aisyah Putri</span></h1>
      <p class="bio" id="bio"></p>
      <ul class="chips">
        <li id="chipKelas"></li>
        <li id="chipSekolah"></li>
      </ul>
      <div class="cta">
        <a class="btn" href="#tentang">Kenalan yuk</a>
        <a class="btn btn--ghost" href="#sekolah">Riwayat sekolah</a>
      </div>
    </header>

    <section class="block" id="tentang">
      <h2>Tentang aku</h2>
      <div class="about">
        <p class="about__text" id="tentangText"></p>
        <div class="fields" id="detail"></div>
      </div>
    </section>

    <section class="block block--soft" id="sekolah">
      <h2>Perjalanan sekolahku</h2>
      <ol class="steps" id="timeline"></ol>
    </section>
  </main>

  <footer class="footer">
    <p id="footerText"></p>
    <p class="footer__sub">Dibuat dengan ♡</p>
  </footer>
  <a class="top" href="#atas" aria-label="Ke atas">&uarr;</a>

  <script src="script.js"></script>
</body>
</html>
